name: VericoMedia digest (REAL PUBLICATION DISABLED)
on:
  schedule:
    - cron: '0 3 1,8 11 *'
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [fixture, preflight, dry-run]
        default: fixture
      publication_date:
        type: choice
        options: ['2026-11-01', '2026-11-08']
        default: '2026-11-01'
  push:
    branches: [codex/vericomedia-digest]
permissions:
  contents: read
concurrency:
  group: vericomedia-digest-${{ github.repository }}
  cancel-in-progress: false
jobs:
  digest:
    if: github.repository == 'verico26/vericomedia-publisher'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    environment: vericomedia-digest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Protect artifacts and determine run
        id: run
        env:
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_MODE: ${{ inputs.mode }}
          REQUESTED_DATE: ${{ inputs.publication_date }}
        run: |
          python - <<'PY'
          import os
          from datetime import datetime, timezone
          today = datetime.now(timezone.utc).date().isoformat()
          event = os.environ['EVENT_NAME']
          allowed = event != 'schedule' or today in ('2026-11-01', '2026-11-08')
          mode = 'dry-run' if event == 'schedule' else (os.environ['REQUESTED_MODE'] or 'fixture')
          date = today if event == 'schedule' else (os.environ['REQUESTED_DATE'] or '2026-11-01')
          with open(os.environ['GITHUB_OUTPUT'],'a') as output:
              output.write(f'allowed={str(allowed).lower()}\nmode={mode}\ndate={date}\n')
          PY
      - if: steps.run.outputs.allowed == 'true'
        run: python -m pip install -r requirements-digest.txt
      - if: steps.run.outputs.allowed == 'true'
        run: python -m playwright install --with-deps chromium
      - name: Tests
        if: steps.run.outputs.allowed == 'true'
        run: python -m unittest discover -s tests -v
        env:
          PYTHONPATH: src
          RUN_BROWSER_TESTS: '1'
      - name: Probe MCP HTTPS endpoint without credentials or write tools
        if: steps.run.outputs.allowed == 'true'
        run: python scripts/probe_mcp_endpoint.py
      - name: Check GitHub secret presence and MCP read access when configured
        if: steps.run.outputs.allowed == 'true'
        env:
          PYTHONPATH: src
          TILDA_MCP_TOKEN: ${{ secrets.TILDA_MCP_TOKEN }}
          VERICO_LLM_API_KEY: ${{ secrets.VERICO_LLM_API_KEY }}
          VERICO_ARTIFACT_KEY: ${{ secrets.VERICO_ARTIFACT_KEY }}
        run: python scripts/probe_runner_auth.py
      - name: Check artifact protection before paid or private operations
        if: steps.run.outputs.allowed == 'true' && steps.run.outputs.mode != 'fixture'
        env:
          VERICO_ARTIFACT_KEY: ${{ secrets.VERICO_ARTIFACT_KEY }}
          PYTHONPATH: src
        run: python -c 'from vericomedia_publisher.digest.artifacts import key_from_env; key_from_env()'
      - name: Sequential research, writing, editing, HTML, QA, report
        if: steps.run.outputs.allowed == 'true'
        env:
          PYTHONPATH: src
          DIGEST_MODE: ${{ steps.run.outputs.mode }}
          PUBLICATION_DATE: ${{ steps.run.outputs.date }}
          TILDA_MCP_TOKEN: ${{ secrets.TILDA_MCP_TOKEN }}
          VERICO_LLM_API_KEY: ${{ secrets.VERICO_LLM_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m vericomedia_publisher.digest.pipeline --mode "$DIGEST_MODE" --publication-date "$PUBLICATION_DATE" --output artifacts/digest
      - name: Encrypt editorial archive before upload
        if: always() && steps.run.outputs.allowed == 'true'
        env:
          PYTHONPATH: src
          VERICO_ARTIFACT_KEY: ${{ secrets.VERICO_ARTIFACT_KEY }}
          DIGEST_MODE: ${{ steps.run.outputs.mode }}
        run: |
          if [ ! -f artifacts/digest/publication-report.json ]; then
            exit 0
          fi
          if [ "$DIGEST_MODE" = "fixture" ] && [ -z "$VERICO_ARTIFACT_KEY" ]; then
            python -m vericomedia_publisher.digest.artifacts encrypt artifacts/digest artifacts/protected/digest.enc --fixture-ephemeral
          else
            python -m vericomedia_publisher.digest.artifacts encrypt artifacts/digest artifacts/protected/digest.enc
          fi
      - name: Upload encrypted archive only
        if: always() && steps.run.outputs.allowed == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: vericomedia-digest-encrypted-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: warn
          path: artifacts/protected/*.enc
